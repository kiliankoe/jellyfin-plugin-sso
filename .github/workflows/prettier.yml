name: Prettier Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check formatting
        run: npx --yes prettier@3 --check "**/*.{js,html,md,css,scss}"
