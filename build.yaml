  - "Duende.IdentityModel.OidcClient.dll"
  - "Duende.IdentityModel.dll"
  - "Microsoft.IdentityModel.JsonWebTokens.dll"
  - "Microsoft.IdentityModel.Tokens.dll"
  - "Microsoft.IdentityModel.Logging.dll"
  - "Microsoft.IdentityModel.Abstractions.dll"
  - "Microsoft.Bcl.Cryptography.dll"
changelog: |
  6.0.0.0: Jellyfin 12 support (net10.0, targetAbi 12.0.0.0), built against Jellyfin.Controller/Model 12.0.0-rc6.
  5.1.0.0: Consolidated fork release. OIDC identities are keyed on the sub claim, so a username change at the provider no longer breaks login or provisions a duplicate account (#146); links created before this are migrated on next login. Role mapping accepts multiple claim paths. The configured folder list now applies alongside folder roles instead of being ignored. A failed UserInfo request explains the Cloudflare Access workaround instead of erroring blankly. Dependencies refreshed and the vulnerable System.Security.Cryptography.Xml pin removed.
  5.0.0.2: Add OID device code flow authentication endpoint (POST /sso/OID/DeviceAuth/{provider}, RFC 8628).
  5.0.0.1: Restyle the sign-in handoff page to match Jellyfin: native MDL spinner with the status text centered beneath it, and errors shown in red instead of plain text. Themeable via CSS variables.
  5.0.0.0: Overhaul the auth handoff so SSO login works in the native Jellyfin mobile apps (Android & iOS Expo), not just the web UI. Credentials are now built directly from the auth response and applied in the top frame instead of polling an iframed web client's localStorage, which never completed inside the native apps. Failures now surface an error instead of hanging on "Logging in...". Also fixes login when a canonical link points to a stale user GUID (#315).
  4.0.0.7: Fix and secure OIDC/SAML self-service account linking with authenticated, short-lived, single-use server-side transactions. Linking must now start from /SSOViews/linking; the legacy ?isLinking=true flow is no longer supported. Prevent identities linked to another Jellyfin account from being silently reassigned.
  4.0.0.6: Fix role-mapped permissions (admin, folders, Live TV) never being saved to the database on Jellyfin 10.11, which made them silently revert on every server restart (#367). PreserveAdminPermissions now defaults to false: admin status is synced strictly from roles unless explicitly opted in.
  4.0.0.5: Add PreserveAdminPermissions option (default true) so OIDC/SAML logins no longer silently revoke admin when role mapping doesn't match. Add diagnostic logging for admin role decisions.
  4.0.0.4: Fix security issue in SAML
  4.0.0.0: Jellyfin 10.11
  3.5.3.0: Allow for OID-provided avatars, various bugfixes and workarounds
  3.5.2.4: Updates for Jellyfin 10.9
  3.5.2.3: Improve OpenID discovery policy security rules, fix iOS login bugs related to cache
  3.5.2.2: Fix linking page when using new paths
  3.5.2.1: Hotfix for SAML null checks
  3.5.2.0: Allow overriding the scheme used for generating URLs.
  3.5.1.1: Change iframe URL to point to the web UI instead of the root 
  3.5.1.0: Improved paths! No more obscure "p" versus "r" URLs! Improve final redirect for automatic authentication. Add more configuration options for OpenID discovery.
  3.5.0.0: Add support for Live TV authentication. Fix various null pointer bugs.
  3.4.0.0: Add user self-service for linking existing accounts + managing existing links. Allow IDP accounts to be linked to jellyfin accounts with a different display-name.
  3.3.0.0: Add fallback authentication provider. Add OpenID admin page.
  3.2.0.0: Switch to hashmaps (BREAKING) for performance. Dump expected permissions in logs on error.
  3.1.0.1: Fix redirect bug in WebResponse (#7)
  3.1.0.0: Simplify auth flow so loading the web UI is not required
  3.0.0.0: Add more RBAC features and option to unregister user from SSO
  2.0.1.0: Fix improper artifact loading
  2.0.0.0: Add RBAC and Google support
  1.0.0.0: Initial Release
